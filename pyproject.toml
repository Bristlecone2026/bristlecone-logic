[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bristlecone-mcp"
version = "0.1.2"
description = "Micro-settled utility tools for AI agents and MCP clients by Bristlecone Logic"
readme = "MCP_README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Bristlecone Logic", email = "contact@bristleconelogic.com" }
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
bristlecone-mcp = "bristlecone_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bristlecone_mcp"]
