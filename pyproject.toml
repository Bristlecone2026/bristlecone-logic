[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bristlecone-logic"
version = "0.3.0"
description = "Bristlecone Logic™: Deterministic Guardrails & Micro-Utilities for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bristlecone Logic LLC"}
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2.0",
]
crewai = [
    "crewai>=0.50.0",
]
all = [
    "langchain-core>=0.2.0",
    "crewai>=0.50.0",
]

[project.urls]
Homepage = "https://bristleconelogic.com"
Documentation = "https://api.bristleconelogic.com/docs"
Repository = "https://github.com/Bristlecone2026/bristlecone-logic"
