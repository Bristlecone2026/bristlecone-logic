[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bristlecone-logic"
version = "0.2.0"
authors = [
    { name = "Bristlecone Logic", email = "support@bristleconelogic.com" }
]
description = "Deterministic microservices for autonomous agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://bristleconelogic.com"
API = "https://api.bristleconelogic.com"
