services:
  db:
    image: postgres:16-alpine
    container_name: bristlecone_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: bristlecone_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bristlecone_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bristlecone_net

  api:
    build: .
    container_name: bristlecone_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@db:5432/bristlecone_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bristlecone_net

  ui:
    build: .
    container_name: bristlecone_ui
    restart: always
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - bristlecone_net

  nginx:
    image: nginx:alpine
    container_name: bristlecone_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api
      - ui
    networks:
      - bristlecone_net

networks:
  bristlecone_net:
    driver: bridge

volumes:
  postgres_data:
  certbot_etc:
  certbot_www:
