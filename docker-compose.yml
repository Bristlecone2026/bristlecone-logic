
services:
  db:
    image: postgres:16-alpine
    container_name: bristlecone_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: bristlecone_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bristlecone_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bristlecone_net

  api:
    build: .
    container_name: bristlecone_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@db:5432/bristlecone_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - bristlecone_net

networks:
  bristlecone_net:
    driver: bridge

volumes:
  postgres_data:
