services:
  api:
    build: .
    container_name: bristlecone_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bristlecone_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: bristlecone_worker
    command: python3 worker.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bristlecone_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: bristlecone_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bristlecone_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: bristlecone_redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: bristlecone_proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
