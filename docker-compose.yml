services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    container_name: bristlecone_api
    depends_on:
    - db
    - redis
    env_file:
    - .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bristlecone_db
    - REDIS_URL=redis://redis:6379/0
  db:
    container_name: bristlecone_db
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=bristlecone_db
    image: postgres:16
    ports:
    - 5432:5432
  nginx:
    container_name: bristlecone_proxy
    depends_on:
    - api
    image: nginx:latest
    ports:
    - 443:443
    - 80:80
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/certs:/etc/nginx/certs:ro
  redis:
    container_name: bristlecone_redis
    image: redis:7-alpine
    ports:
    - 6379:6379
  worker:
    build: .
    command: python3 worker.py
    container_name: bristlecone_worker
    depends_on:
    - db
    - redis
    environment:
    - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bristlecone_db
    - REDIS_URL=redis://redis:6379/0
