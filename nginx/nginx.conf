events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=tenant_limit:10m rate=60r/m;
    limit_req_status 429;

    # Redirect HTTP traffic to HTTPS
    server {
        listen 80;
        server_name bristleconelogic.com app.bristleconelogic.com api.bristleconelogic.com localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main App (bristleconelogic.com & app.bristleconelogic.com & localhost default)
    server {
        listen 443 ssl default_server;
        server_name bristleconelogic.com app.bristleconelogic.com localhost;

        ssl_certificate /etc/letsencrypt/live/bristleconelogic.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bristleconelogic.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Streamlit Dashboard
        location / {
            proxy_pass http://ui:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # API fallback endpoint with rate limiting
        location /api/ {
            limit_req zone=tenant_limit burst=10 nodelay;

            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Dedicated API Subdomain (api.bristleconelogic.com)
    server {
        listen 443 ssl;
        server_name api.bristleconelogic.com;

        ssl_certificate /etc/letsencrypt/live/bristleconelogic.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bristleconelogic.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            limit_req zone=tenant_limit burst=10 nodelay;

            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
